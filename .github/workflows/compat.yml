name: compat

# FastAPI / Starlette との互換性を、push・PRのたびに差分テストで確認する(不一致があれば失敗)。
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 3 * * *'   # 毎日: 最新の上流で再試験
  workflow_dispatch:

jobs:
  compat:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12", "3.14", "3.x"]
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sibling open-cpu (bundled into mfastapi-server)
        shell: bash
        run: |
          [ -d "$GITHUB_WORKSPACE/../open-cpu" ] || git clone --depth 1 https://github.com/aon-co-jp/open-cpu.git "$GITHUB_WORKSPACE/../open-cpu"
          [ -d "$GITHUB_WORKSPACE/../RMojo" ] || git clone --depth 1 https://github.com/aon-co-jp/RMojo.git "$GITHUB_WORKSPACE/../RMojo"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust unit tests
        run: cargo test --release --manifest-path rust/mfastapi-core/Cargo.toml
      - name: Build and install (Rust extension is the default backend)
        run: pip install ".[fastapi]" httpx pydantic
      - name: Backend is Rust
        run: python -c "import mfastapi; assert mfastapi.backend()=='rust', mfastapi.backend()"
      - name: Router equivalence vs Starlette and FastAPI
        run: python -m mfastapi_equiv_selftest
      - name: Rust security core vs Pydantic / parse_qsl (differential fuzz)
        run: |
          cargo build --release --manifest-path rust/mfastapi-core/Cargo.toml
          MFASTAPI_RS_LIB=$PWD/rust/mfastapi-core/target/release/libmfastapi_core.so PYTHONPATH=python python tests/test_rust_core.py
      - name: Rust HTTP server (stage C) vs real FastAPI on uvicorn
        run: |
          pip install uvicorn
          cargo build --release --manifest-path rust/mfastapi-server/Cargo.toml
          rust/mfastapi-server/target/release/mfastapi-server c 8831 &
          sleep 3
          PYTHONPATH=python:tests/mojo_endpoint python tests/mojo_endpoint/test_mojo_server_compat.py http://127.0.0.1:8831 c

  upstream-issue:
    # 毎日の定期実行(最新の Python / Flask / Django / FastAPI / Rust で再試験)が失敗したら、日付つきで issue を1件起こす
    if: failure() && github.event_name == 'schedule'
    needs: [compat]
    runs-on: ubuntu-latest
    permissions: { issues: write }
    steps:
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          t="upstream: 最新版での定期試験が失敗 ($(date -u +%F))"
          gh issue list -R "$GITHUB_REPOSITORY" --state open --search "$t in:title" --json number -q '.[0].number' | grep -q . ||             gh issue create -R "$GITHUB_REPOSITORY" --title "$t" --body "最新の上流(Python・Flask・Django・FastAPI・Starlette・Rust・Mojo)で定期試験が失敗しました。実行: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
