name: wheels

# 配布用ホイール(manylinux / macOS / Windows)をビルドし、各ホイールで等価性テストを実行する。
# PyPIへの公開は含めない(アカウント・信頼できる発行元の設定が必要なため)。成果物はActionsのアーティファクトとして保存する。
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  wheels:
    name: wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-15-intel, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (Windows ARM64 runner)
        if: matrix.os == 'windows-11-arm'
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://win.rustup.rs/aarch64 -OutFile rustup-init.exe
            ./rustup-init.exe -y --default-host aarch64-pc-windows-msvc --profile minimal
            echo "$env:USERPROFILE/.cargo/bin" >> $env:GITHUB_PATH
          }
      - uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_SKIP: "pp* *-musllinux_* *-manylinux_i686 cp38-*"
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=10.12  # Rust (rustc) の最低要件
          CIBW_BEFORE_ALL_WINDOWS: "rustup target add i686-pc-windows-msvc"
          CIBW_BEFORE_ALL_LINUX: "curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
          CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH"'
          CIBW_TEST_REQUIRES: "fastapi httpx"
          # Rust拡張が既定のバックエンドとして入っていること + 等価性テスト
          CIBW_TEST_COMMAND: "python -c \"import mfastapi; assert mfastapi.backend()=='rust', mfastapi.backend()\" && python -m mfastapi_equiv_selftest"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  server:
    # Rust demo/reference server (pure-Rust handlers) as a standalone binary per platform
    name: server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x86_64, exe: mfastapi-server }
          - { os: ubuntu-24.04-arm, name: linux-aarch64, exe: mfastapi-server }
          - { os: windows-latest, name: windows-x86_64, exe: mfastapi-server.exe }
          - { os: windows-11-arm, name: windows-arm64, exe: mfastapi-server.exe }
          - { os: macos-15-intel, name: macos-x86_64, exe: mfastapi-server }
          - { os: macos-latest, name: macos-arm64, exe: mfastapi-server }
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sibling open-cpu (bundled into mfastapi-server)
        shell: bash
        run: |
          [ -d "$GITHUB_WORKSPACE/../open-cpu" ] || git clone --depth 1 https://github.com/aon-co-jp/open-cpu.git "$GITHUB_WORKSPACE/../open-cpu"
          [ -d "$GITHUB_WORKSPACE/../RMojo" ] || git clone --depth 1 https://github.com/aon-co-jp/RMojo.git "$GITHUB_WORKSPACE/../RMojo"
      - name: Rust toolchain (Windows ARM64 runner)
        if: matrix.os == 'windows-11-arm'
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://win.rustup.rs/aarch64 -OutFile rustup-init.exe
            ./rustup-init.exe -y --default-host aarch64-pc-windows-msvc --profile minimal
            echo "$env:USERPROFILE/.cargo/bin" >> $env:GITHUB_PATH
          }
      - run: cargo build --release --manifest-path rust/mfastapi-server/Cargo.toml
      - name: smoke test (GET /fib/10 -> 55, POST /echo, 405)
        shell: bash
        run: |
          rust/mfastapi-server/target/release/${{ matrix.exe }} --cpu | grep -q "worker threads"
          rust/mfastapi-server/target/release/${{ matrix.exe }} c 18080 &
          sleep 2
          test "$(curl -s http://127.0.0.1:18080/fib/10)" = "55"
          test "$(curl -s -X POST http://127.0.0.1:18080/echo -d '{"a":1}')" = '{"a":1}'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X PUT http://127.0.0.1:18080/echo)" = "405"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18080/echo -d '{bad')" = "422"
      - name: package
        shell: bash
        run: |
          mkdir out
          cp rust/mfastapi-server/target/release/${{ matrix.exe }} "out/mfastapi-server-${{ matrix.name }}${{ endsWith(matrix.exe, '.exe') && '.exe' || '' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.name }}
          path: out/*

  server-android:
    # Android (aarch64) 向けの単体サーバー。実機相当の起動試験はローカルで済ませ、CIはビルドと添付のみ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sibling open-cpu (bundled into mfastapi-server)
        shell: bash
        run: |
          [ -d "$GITHUB_WORKSPACE/../open-cpu" ] || git clone --depth 1 https://github.com/aon-co-jp/open-cpu.git "$GITHUB_WORKSPACE/../open-cpu"
          [ -d "$GITHUB_WORKSPACE/../RMojo" ] || git clone --depth 1 https://github.com/aon-co-jp/RMojo.git "$GITHUB_WORKSPACE/../RMojo"
      - run: rustup target add aarch64-linux-android && cargo install cargo-ndk --locked
      - run: cd rust/mfastapi-server && cargo ndk -t arm64-v8a build --release
      - run: |
          mkdir out
          cp rust/mfastapi-server/target/aarch64-linux-android/release/mfastapi-server out/mfastapi-server-android-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: server-android-aarch64
          path: out/*

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  release:
    # タグ(v*)のときだけ、全ホイールとsdistをGitHub Releaseに添付する(PyPIへは上げない)。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist, server, server-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: sha256 for every asset (used by the startup self-update to verify downloads)
        run: cd artifacts && for f in *; do sha256sum "$f" > "$f.sha256"; done
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Wheels (manylinux x86_64/aarch64, macOS Intel/Apple silicon, Windows x64/ARM64) and sdist. Each wheel passed the router equivalence test in CI. Install: pip install <wheel>."
