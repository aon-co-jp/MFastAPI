[package]
name = "rmojo-py"
version = "0.1.0"
edition = "2021"
description = "CPython extension (PyO3, abi3) running Mojo-style handlers in the memory-safe RMojo interpreter; the GIL is released while a handler runs"
license = "MIT"

[lib]
name = "rmojo_py"
crate-type = ["cdylib", "rlib"]

[dependencies]
rmojo = { path = "../../../RMojo" }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }

[profile.release]
opt-level = 3
lto = true
