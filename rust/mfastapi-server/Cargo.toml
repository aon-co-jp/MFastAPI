[package]
name = "mfastapi-server"
version = "0.2.6"
edition = "2021"
description = "MFastAPI HTTP server layer in Rust: FastAPI-compatible routing, 422 validation errors, OpenAPI/docs; handlers in Rust or Python"
license = "MIT"

[features]
default = []
python = ["dep:pyo3"]
rmojo = ["dep:rmojo"]

[dependencies]
mfastapi-core = { path = "../mfastapi-core" }
# CPU命令セット検出・コア構成(big.LITTLEの高性能コア数からワーカースレッド数を決める)。兄弟リポジトリ F:\open-cpu をソースごと同梱ビルドする
open-cpu = { path = "../../../open-cpu" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
serde_json = "1"
rmojo = { path = "../../../RMojo", optional = true }
pyo3 = { version = "0.30", features = ["auto-initialize"], optional = true }

[profile.release]
opt-level = 3
lto = true
